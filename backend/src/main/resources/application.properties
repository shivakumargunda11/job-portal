spring.datasource.url=jdbc:mysql://localhost:3306/careerconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:career}
spring.datasource.password=${DB_PASSWORD:career123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=true

# JWT - set JWT_SECRET env var in production (must be >= 32 chars)
jwt.secret=${JWT_SECRET:careerconnect-super-secret-key-for-dev-only-32chars}

server.port=8080
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
logging.level.org.springframework.security=DEBUG

# File Upload Configuration (5MB Max)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/resumes
app.upload.max-file-size=5242880

